<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UGS Files - Ultimate Game Stash</title>
    <meta name="description" content="Browse and explore the Ultimate Game Stash collection with advanced filtering and search capabilities.">
    <!-- Press Start 2P Font Import -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #5986da;
            --primary-light: #79aadb;
            --primary-dark: #4a7bc7;
            --secondary-color: #ff6b6b;
            --accent-color: #ffd93d;
            --success-color: #6bcf7f;
            --warning-color: #ffa500;
            --danger-color: #ff4757;
            --bg-dark: #0f0f1e;
            --bg-darker: #0a0a14;
            --bg-card: #1a1a2e;
            --bg-light: #2a2a3e;
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --text-tertiary: rgba(255, 255, 255, 0.5);
            --border-color: rgba(89, 134, 218, 0.2);
            --aurora-1: rgba(89, 134, 218, 0.15);
            --aurora-2: rgba(121, 170, 219, 0.1);
            --aurora-3: rgba(107, 199, 127, 0.08);
            --aurora-4: rgba(255, 107, 107, 0.08);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.1);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.2);
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        [data-theme="light"] {
            --primary-color: #4a7bc7;
            --primary-light: #5986da;
            --bg-dark: #f8f9fa;
            --bg-darker: #ffffff;
            --bg-card: #f0f2f5;
            --bg-light: #e9ecef;
            --text-primary: #1a1a1a;
            --text-secondary: rgba(0, 0, 0, 0.7);
            --text-tertiary: rgba(0, 0, 0, 0.5);
            --border-color: rgba(74, 123, 199, 0.2);
            --aurora-1: rgba(74, 123, 199, 0.08);
            --aurora-2: rgba(89, 134, 218, 0.06);
            --aurora-3: rgba(255, 217, 61, 0.05);
            --aurora-4: rgba(255, 180, 150, 0.05);
        }

        /* 🎮 Global Pixel Font Override */
        *, *::before, *::after, input, button, select, textarea {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Press Start 2P', cursive, monospace !important;
            line-height: 1.5;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: linear-gradient(135deg, var(--bg-dark) 0%, var(--bg-darker) 50%, #16213e 100%);
            min-height: 100vh;
            color: var(--text-primary);
            overflow-x: hidden;
            position: relative;
            font-size: 12px;
        }

        /* ===== AURORA BACKGROUND ===== */
        .aurora-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: inherit;
            overflow: hidden;
        }

        /* Animated gradient mesh layers */
        .aurora-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 200%;
            height: 200%;
            opacity: 0.6;
            mix-blend-mode: screen;
            animation: aurora-drift 25s ease-in-out infinite;
            filter: blur(80px);
        }

        .aurora-layer:nth-child(1) {
            background: radial-gradient(ellipse at 20% 30%, var(--aurora-1) 0%, transparent 50%);
            animation-delay: 0s;
        }

        .aurora-layer:nth-child(2) {
            background: radial-gradient(ellipse at 80% 70%, var(--aurora-2) 0%, transparent 50%);
            animation-delay: -8s;
            animation-duration: 30s;
        }

        .aurora-layer:nth-child(3) {
            background: radial-gradient(ellipse at 40% 80%, var(--aurora-3) 0%, transparent 50%);
            animation-delay: -15s;
            animation-duration: 35s;
        }

        .aurora-layer:nth-child(4) {
            background: radial-gradient(ellipse at 60% 20%, var(--aurora-4) 0%, transparent 50%);
            animation-delay: -5s;
            animation-duration: 28s;
        }

        @keyframes aurora-drift {
            0%, 100% {
                transform: translate(0, 0) scale(1);
            }
            25% {
                transform: translate(-30px, -50px) scale(1.1);
            }
            50% {
                transform: translate(40px, 30px) scale(0.95);
            }
            75% {
                transform: translate(-20px, 60px) scale(1.05);
            }
        }

        /* Floating orbs */
        .floating-orb {
            position: absolute;
            border-radius: 50%;
            opacity: 0;
            mix-blend-mode: screen;
            filter: blur(60px);
            animation: float-orb 15s ease-in-out infinite;
        }

        .floating-orb:nth-child(5) {
            width: 300px;
            height: 300px;
            top: -100px;
            left: 10%;
            background: radial-gradient(circle, var(--aurora-1) 0%, transparent 70%);
            animation-delay: 0s;
        }

        .floating-orb:nth-child(6) {
            width: 250px;
            height: 250px;
            top: 50%;
            right: 5%;
            background: radial-gradient(circle, var(--aurora-2) 0%, transparent 70%);
            animation-delay: -5s;
        }

        .floating-orb:nth-child(7) {
            width: 280px;
            height: 280px;
            bottom: -80px;
            left: 50%;
            background: radial-gradient(circle, var(--aurora-3) 0%, transparent 70%);
            animation-delay: -10s;
        }

        .floating-orb:nth-child(8) {
            width: 320px;
            height: 320px;
            top: 30%;
            left: 60%;
            background: radial-gradient(circle, var(--aurora-4) 0%, transparent 70%);
            animation-delay: -3s;
        }

        @keyframes float-orb {
            0%, 100% {
                transform: translate(0, 0) scale(1);
                opacity: 0.3;
            }
            25% {
                transform: translate(-40px, -60px) scale(1.15);
                opacity: 0.5;
            }
            50% {
                transform: translate(30px, 50px) scale(0.9);
                opacity: 0.3;
            }
            75% {
                transform: translate(-50px, 30px) scale(1.1);
                opacity: 0.4;
            }
        }

        .animated-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(-45deg, rgba(89, 134, 218, 0.05), rgba(255, 107, 107, 0.02), rgba(255, 217, 61, 0.02), rgba(107, 199, 127, 0.02));
            background-size: 400% 400%;
            animation: gradientShift 20s ease infinite;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ===== CUSTOM CURSOR ===== */
        body {
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"><circle cx="16" cy="16" r="6" fill="%235986da" opacity="0.6"/><circle cx="16" cy="16" r="10" fill="none" stroke="%235986da" stroke-width="1" opacity="0.4"/></svg>') 16 16, auto;
        }

        a, button, input[type="button"] {
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"><circle cx="16" cy="16" r="8" fill="%235986da" opacity="0.8"/><circle cx="16" cy="16" r="12" fill="none" stroke="%235986da" stroke-width="1.5" opacity="0.5"/></svg>') 16 16, pointer;
        }

        /* ===== SPLASH SCREEN ===== */
        .splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--bg-dark) 0%, var(--bg-darker) 50%, #16213e 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            animation: fadeOutSplash 0.6s ease-out 2.4s forwards;
            backdrop-filter: blur(10px);
        }

        @keyframes fadeOutSplash {
            0% { opacity: 1; visibility: visible; }
            100% { opacity: 0; visibility: hidden; }
        }

        .splash-content {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        .splash-logo {
            font-size: 38px;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-light) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: scaleIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s backwards;
            letter-spacing: -1px;
        }

        .splash-subtitle {
            font-size: 12px;
            color: var(--text-secondary);
            letter-spacing: 2px;
            animation: fadeInUp 0.8s ease-out 0.5s backwards;
        }

        .loading-dots {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-color), var(--primary-light));
            animation: bounce 1.4s infinite;
            box-shadow: 0 0 20px rgba(89, 134, 218, 0.5);
        }

        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); opacity: 0.6; }
            50% { transform: translateY(-20px); opacity: 1; }
        }

        @keyframes scaleIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes fadeInUp {
            0% { transform: translateY(20px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        /* ===== MAIN APP ===== */
        .app-wrapper {
            width: 100%;
            min-height: 100vh;
            display: flex;
            animation: fadeIn 0.6s ease-out 2.4s backwards;
        }

        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 100px;
            height: 100vh;
            background: rgba(20, 20, 40, 0.7);
            backdrop-filter: blur(20px);
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            border-right: 1px solid var(--border-color);
            z-index: 1000;
            animation: slideInLeft 0.5s ease-out 2.4s backwards;
            transition: width 0.3s ease;
        }

        @keyframes slideInLeft {
            0% { transform: translateX(-100%); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }

        .sidebar::-webkit-scrollbar {
            width: 6px;
        }

        .sidebar::-webkit-scrollbar-thumb {
            background: rgba(89, 134, 218, 0.4);
            border-radius: 3px;
        }

        .sidebar::-webkit-scrollbar-thumb:hover {
            background: rgba(89, 134, 218, 0.7);
        }

        .sidebar-btn {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
            border: 1px solid rgba(89, 134, 218, 0.3);
            padding: 14px;
            font-size: 14px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            color: white;
            text-align: center;
            min-height: 50px;
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-md);
        }

        .sidebar-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.6s ease;
        }

        .sidebar-btn:hover:not(.empty) {
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 12px 40px rgba(89, 134, 218, 0.6);
            background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary-color) 100%);
        }

        .sidebar-btn:hover::before {
            left: 100%;
        }

        .sidebar-btn:active:not(.empty) {
            transform: translateY(-1px) scale(1.02);
        }

        /* ===== SIDEBAR PROGRESS INDICATOR ===== */
        .sidebar-progress {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 0;
            background: linear-gradient(180deg, var(--primary-color), var(--primary-light));
            box-shadow: 0 0 15px var(--primary-color), 0 0 30px rgba(89, 134, 218, 0.5);
            transition: height 0.3s ease-out;
            border-radius: 1px;
        }

        /* ===== ACTIVE SECTION HIGHLIGHT ===== */
        .sidebar-btn.active {
            background: linear-gradient(135deg, var(--primary-light) 0%, var(--accent-color) 100%);
            box-shadow: 0 0 20px var(--primary-color), 0 8px 25px rgba(89, 134, 218, 0.5);
            transform: scale(1.1);
            animation: pulse-glow 2s ease-in-out infinite;
        }

        @keyframes pulse-glow {
            0%, 100% {
                box-shadow: 0 0 20px var(--primary-color), 0 8px 25px rgba(89, 134, 218, 0.5);
            }
            50% {
                box-shadow: 0 0 30px var(--primary-color), 0 8px 35px rgba(89, 134, 218, 0.7);
            }
        }

        .sidebar-btn.active:hover {
            transform: scale(1.15);
        }

        /* ===== MAIN CONTENT ===== */
        .main-content {
            margin-left: 100px;
            flex: 1;
            padding: 40px 20px;
            overflow-y: auto;
            animation: slideInUp 0.6s ease-out 2.4s backwards;
            position: relative;
        }

        @keyframes slideInUp {
            0% { transform: translateY(30px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        .main-content::-webkit-scrollbar {
            width: 10px;
        }

        .main-content::-webkit-scrollbar-thumb {
            background: rgba(89, 134, 218, 0.4);
            border-radius: 5px;
        }

        .main-content::-webkit-scrollbar-thumb:hover {
            background: rgba(89, 134, 218, 0.7);
        }

        /* ===== HEADER ===== */
        .header {
            position: sticky;
            top: 0;
            background: rgba(20, 20, 40, 0.6);
            backdrop-filter: blur(20px);
            padding: 20px 0;
            margin-bottom: 40px;
            border-bottom: 1px solid var(--border-color);
            z-index: 100;
            animation: slideInDown 0.6s ease-out 2.5s backwards;
        }

        @keyframes slideInDown {
            0% { transform: translateY(-30px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        h1 {
            color: var(--text-primary);
            text-align: center;
            margin-bottom: 15px;
            font-size: 24px;
            letter-spacing: -1px;
            background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary-color) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.4;
        }

        .header-subtitle {
            text-align: center;
            color: var(--text-tertiary);
            font-size: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
            animation: fadeIn 0.8s ease-out 2.6s backwards;
        }

        .header-links {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
            animation: fadeIn 0.8s ease-out 2.6s backwards;
        }

        .header-link-item {
            color: var(--text-primary);
            text-align: center;
            font-size: 11px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .header-link-item a {
            color: var(--primary-light);
            text-decoration: none;
            transition: all 0.3s ease;
            position: relative;
            display: inline-block;
        }

        .header-link-item a::after {
            content: '';
            position: absolute;
            bottom: -3px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--primary-color), var(--primary-light));
            transition: width 0.3s ease;
        }

        .header-link-item a:hover {
            color: var(--accent-color);
        }

        .header-link-item a:hover::after {
            width: 100%;
        }

        .header-controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
            animation: fadeIn 0.8s ease-out 2.7s backwards;
        }

        /* ===== DARK MODE TOGGLE ===== */
        .theme-toggle {
            position: relative;
            width: 70px;
            height: 38px;
            background: rgba(89, 134, 218, 0.2);
            border: 2px solid var(--primary-color);
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            align-items: center;
            padding: 4px;
            box-shadow: var(--shadow-md);
        }

        .theme-toggle:hover {
            background: rgba(89, 134, 218, 0.3);
            box-shadow: 0 0 25px rgba(89, 134, 218, 0.5);
            transform: scale(1.05);
        }

        .theme-toggle.light {
            background: rgba(255, 217, 61, 0.15);
            border-color: var(--accent-color);
        }

        .theme-toggle.light:hover {
            box-shadow: 0 0 25px rgba(255, 217, 61, 0.5);
        }

        .toggle-circle {
            width: 30px;
            height: 30px;
            background: var(--primary-light);
            border-radius: 50%;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .theme-toggle.light .toggle-circle {
            background: var(--accent-color);
            transform: translateX(32px);
            box-shadow: 0 2px 8px rgba(255, 217, 61, 0.4);
        }

        .toggle-icon {
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.3));
        }

        /* ===== SEARCH & FILTER ===== */
        .search-container {
            display: flex;
            justify-content: center;
            margin-bottom: 40px;
            gap: 15px;
            flex-wrap: wrap;
            animation: fadeIn 0.8s ease-out 2.7s backwards;
        }

        #searchInput {
            padding: 16px 24px;
            width: 100%;
            max-width: 500px;
            border-radius: 16px;
            border: 2px solid var(--border-color);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: var(--shadow-lg);
            color: var(--text-primary);
            font-size: 11px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        #searchInput::placeholder {
            color: var(--text-tertiary);
        }

        #searchInput:focus {
            outline: none;
            border-color: var(--primary-color);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 40px rgba(89, 134, 218, 0.4);
            transform: translateY(-2px);
        }

        #lolbutton {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
            border: 1px solid rgba(89, 134, 218, 0.3);
            padding: 14px 28px;
            border-radius: 12px;
            color: white;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: var(--shadow-md);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        #lolbutton::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.6s ease;
        }

        #lolbutton:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(89, 134, 218, 0.5);
            background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary-color) 100%);
        }

        #lolbutton:hover::before {
            left: 100%;
        }

        #lolbutton:active {
            transform: translateY(-1px);
        }

        /* ===== LETTER SECTIONS ===== */
        .letter-section {
            margin-bottom: 50px;
            padding: 35px;
            max-width: 1100px;
            margin-left: auto;
            margin-right: auto;
            min-height: 100px;
            background: rgba(15, 15, 30, 0.15);
            border-radius: 20px;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(8px);
            box-shadow: var(--shadow-lg);
            animation: fadeInScale 0.6s ease-out forwards;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .letter-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--primary-color), transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .letter-section:hover {
            border-color: var(--primary-color);
            background: rgba(15, 15, 30, 0.25);
            box-shadow: 0 12px 50px rgba(89, 134, 218, 0.3);
            transform: translateY(-2px);
        }

        .letter-section:hover::before {
            opacity: 1;
        }

        @keyframes fadeInScale {
            0% { opacity: 0; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1); }
        }

        .letter-section:nth-child(1) { animation-delay: 2.8s; }
        .letter-section:nth-child(2) { animation-delay: 2.95s; }
        .letter-section:nth-child(3) { animation-delay: 3.1s; }
        .letter-section:nth-child(4) { animation-delay: 3.25s; }
        .letter-section:nth-child(5) { animation-delay: 3.4s; }

        .letter-section.empty {
            opacity: 0.4;
            border-color: transparent;
            background: rgba(15, 15, 30, 0.08);
        }

        .letter-header {
            color: var(--primary-light);
            font-size: 20px;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border-color);
            text-shadow: 0 4px 15px rgba(89, 134, 218, 0.2);
            letter-spacing: -0.5px;
            transition: all 0.3s ease;
        }

        .letter-section:hover .letter-header {
            color: var(--accent-color);
            border-bottom-color: var(--accent-color);
        }

        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        .empty-message {
            color: var(--text-tertiary);
            font-style: italic;
            text-align: center;
            padding: 40px 20px;
            font-size: 11px;
            position: relative;
        }

        .empty-message::before {
            content: '✨';
            display: block;
            font-size: 32px;
            margin-bottom: 15px;
            animation: float 3s ease-in-out infinite;
        }

        input[type="button"] {
            background: linear-gradient(135deg, rgba(89, 134, 218, 0.8) 0%, rgba(74, 123, 199, 0.8) 100%);
            border: 1px solid var(--border-color);
            padding: 18px 28px;
            font-size: 11px;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: var(--shadow-md);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            width: 100%;
            max-width: 650px;
            color: white;
            text-align: left;
            position: relative;
            overflow: hidden;
            text-transform: capitalize;
            letter-spacing: 0.5px;
        }

        input[type="button"]::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
            transition: left 0.6s ease;
        }

        input[type="button"]:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(89, 134, 218, 0.4);
            background: linear-gradient(135deg, rgba(121, 170, 219, 0.95) 0%, rgba(106, 157, 212, 0.95) 100%);
            border-color: var(--primary-color);
        }

        input[type="button"]:hover::before {
            left: 100%;
        }

        input[type="button"]:active {
            transform: translateY(-1px);
        }

        /* ===== BACK TO TOP BUTTON ===== */
        .back-to-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--primary-color), var(--primary-light));
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 500;
            box-shadow: var(--shadow-lg);
            transition: all 0.3s ease;
            animation: scaleIn 0.3s ease-out;
            color: white;
            font-size: 16px;
        }

        .back-to-top:hover {
            transform: translateY(-5px) scale(1.1);
            box-shadow: 0 12px 40px rgba(89, 134, 218, 0.6);
        }

        .back-to-top:active {
            transform: translateY(-2px) scale(1.05);
        }

        /* ===== TOOLTIP ===== */
        .tooltip {
            position: relative;
            display: inline-block;
        }

        .tooltip .tooltiptext {
            visibility: hidden;
            background-color: var(--primary-color);
            color: white;
            text-align: center;
            border-radius: 8px;
            padding: 8px 12px;
            position: absolute;
            z-index: 1;
            bottom: 125%;
            left: 50%;
            margin-left: -50px;
            opacity: 0;
            transition: opacity 0.3s ease;
            white-space: nowrap;
            font-size: 9px;
            box-shadow: var(--shadow-md);
        }

        .tooltip:hover .tooltiptext {
            visibility: visible;
            opacity: 1;
        }

        /* ===== NOTIFICATIONS ===== */
        .toast-notification {
            position: fixed;
            bottom: 100px;
            right: 30px;
            background: linear-gradient(135deg, var(--success-color) 0%, #5cb85c 100%);
            color: white;
            padding: 16px 24px;
            border-radius: 12px;
            box-shadow: var(--shadow-lg);
            animation: slideInRight 0.4s ease-out;
            z-index: 600;
            max-width: 300px;
            font-size: 10px;
        }

        .toast-notification.warning {
            background: linear-gradient(135deg, var(--warning-color) 0%, #ff8c00 100%);
        }

        .toast-notification.error {
            background: linear-gradient(135deg, var(--danger-color) 0%, #ff3838 100%);
        }

        @keyframes slideInRight {
            0% { transform: translateX(400px); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }

        /* ===== MODALS ===== */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            animation: fadeIn 0.3s ease-out;
        }

        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: var(--bg-card);
            padding: 40px;
            border-radius: 20px;
            max-width: 500px;
            width: 90%;
            border: 1px solid var(--border-color);
            animation: scaleIn 0.3s ease-out;
            box-shadow: var(--shadow-lg);
        }

        .modal-header {
            font-size: 18px;
            margin-bottom: 20px;
            color: var(--primary-light);
        }

        .modal-body {
            color: var(--text-secondary);
            margin-bottom: 30px;
            line-height: 1.6;
            font-size: 11px;
        }

        .modal-footer {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .modal-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 10px;
        }

        .modal-btn.primary {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            color: white;
        }

        .modal-btn.primary:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .modal-btn.secondary {
            background: var(--bg-light);
            color: var(--text-primary);
        }

        .modal-btn.secondary:hover {
            background: rgba(89, 134, 218, 0.2);
        }

        /* ===== FOOTER ===== */
        footer {

            color: var(--text-tertiary);
            font-size: 10px;
            border-top: 1px solid var(--border-color);
            margin-top: 60px;
        }
    </style>
</head>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UGS Files - Ultimate Game Stash</title>
    <meta name="description" content="Browse and explore the Ultimate Game Stash collection with advanced filtering and search capabilities.">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&display=swap');

        :root {
            --primary-color: #5986da;
            --primary-light: #79aadb;
            --primary-dark: #4a7bc7;
            --secondary-color: #ff6b6b;
            --accent-color: #ffd93d;
            --success-color: #6bcf7f;
            --warning-color: #ffa500;
            --danger-color: #ff4757;
            --bg-dark: #0f0f1e;
            --bg-darker: #0a0a14;
            --bg-card: #1a1a2e;
            --bg-light: #2a2a3e;
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --text-tertiary: rgba(255, 255, 255, 0.5);
            --border-color: rgba(89, 134, 218, 0.2);
            --aurora-1: rgba(89, 134, 218, 0.15);
            --aurora-2: rgba(121, 170, 219, 0.1);
            --aurora-3: rgba(107, 199, 127, 0.08);
            --aurora-4: rgba(255, 107, 107, 0.08);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.1);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.2);
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        [data-theme="light"] {
            --primary-color: #4a7bc7;
            --primary-light: #5986da;
            --bg-dark: #f8f9fa;
            --bg-darker: #ffffff;
            --bg-card: #f0f2f5;
            --bg-light: #e9ecef;
            --text-primary: #1a1a1a;
            --text-secondary: rgba(0, 0, 0, 0.7);
            --text-tertiary: rgba(0, 0, 0, 0.5);
            --border-color: rgba(74, 123, 199, 0.2);
            --aurora-1: rgba(74, 123, 199, 0.08);
            --aurora-2: rgba(89, 134, 218, 0.06);
            --aurora-3: rgba(255, 217, 61, 0.05);
            --aurora-4: rgba(255, 180, 150, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Pixelify Sans', sans-serif !important;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Pixelify Sans', sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, var(--bg-darker) 50%, #16213e 100%);
            min-height: 100vh;
            color: var(--text-primary);
            overflow-x: hidden;
            position: relative;
        }

        .aurora-bg {
            position: fixed;
            inset: 0;
            z-index: -2;
            overflow: hidden;
            background: inherit;
        }

        .aurora-layer,
        .floating-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.6;
            mix-blend-mode: screen;
        }

        .aurora-layer:nth-child(1) {
            inset: 0;
            background: radial-gradient(ellipse at 20% 30%, var(--aurora-1) 0%, transparent 50%);
            animation: aurora-drift 25s ease-in-out infinite;
        }

        .aurora-layer:nth-child(2) {
            inset: 0;
            background: radial-gradient(ellipse at 80% 70%, var(--aurora-2) 0%, transparent 50%);
            animation: aurora-drift 30s ease-in-out infinite reverse;
        }

        .aurora-layer:nth-child(3) {
            inset: 0;
            background: radial-gradient(ellipse at 40% 80%, var(--aurora-3) 0%, transparent 50%);
            animation: aurora-drift 35s ease-in-out infinite;
        }

        .aurora-layer:nth-child(4) {
            inset: 0;
            background: radial-gradient(ellipse at 60% 20%, var(--aurora-4) 0%, transparent 50%);
            animation: aurora-drift 28s ease-in-out infinite reverse;
        }

        .floating-orb:nth-child(5) {
            width: 300px;
            height: 300px;
            top: -100px;
            left: 10%;
            background: radial-gradient(circle, var(--aurora-1) 0%, transparent 70%);
            animation: float-orb 15s ease-in-out infinite;
        }

        .floating-orb:nth-child(6) {
            width: 250px;
            height: 250px;
            top: 50%;
            right: 5%;
            background: radial-gradient(circle, var(--aurora-2) 0%, transparent 70%);
            animation: float-orb 18s ease-in-out infinite reverse;
        }

        .floating-orb:nth-child(7) {
            width: 280px;
            height: 280px;
            bottom: -80px;
            left: 50%;
            background: radial-gradient(circle, var(--aurora-3) 0%, transparent 70%);
            animation: float-orb 17s ease-in-out infinite;
        }

        .floating-orb:nth-child(8) {
            width: 320px;
            height: 320px;
            top: 30%;
            left: 60%;
            background: radial-gradient(circle, var(--aurora-4) 0%, transparent 70%);
            animation: float-orb 14s ease-in-out infinite reverse;
        }

        @keyframes aurora-drift {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(-30px, -50px) scale(1.1); }
            50% { transform: translate(40px, 30px) scale(0.95); }
            75% { transform: translate(-20px, 60px) scale(1.05); }
        }

        @keyframes float-orb {
            0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.3; }
            25% { transform: translate(-40px, -60px) scale(1.15); opacity: 0.5; }
            50% { transform: translate(30px, 50px) scale(0.9); opacity: 0.3; }
            75% { transform: translate(-50px, 30px) scale(1.1); opacity: 0.4; }
        }

        .splash-screen {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, var(--bg-dark) 0%, var(--bg-darker) 50%, #16213e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            backdrop-filter: blur(10px);
            animation: fadeOutSplash 0.6s ease-out 2.4s forwards;
        }

        @keyframes fadeOutSplash {
            0% { opacity: 1; visibility: visible; }
            100% { opacity: 0; visibility: hidden; }
        }

        .splash-content {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        .splash-logo {
            font-size: 84px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-light) 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -2px;
            animation: scaleIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s backwards;
        }

        .splash-subtitle,
        .header-subtitle,
        .empty-message,
        .modal-body,
        .header-link-item,
        .search-container,
        .toast-notification {
            font-family: 'Pixelify Sans', sans-serif;
        }

        .splash-subtitle {
            font-size: 18px;
            color: var(--text-secondary);
            font-weight: 300;
            letter-spacing: 3px;
            animation: fadeInUp 0.8s ease-out 0.5s backwards;
        }

        .loading-dots {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-color), var(--primary-light));
            animation: bounce 1.4s infinite;
            box-shadow: 0 0 20px rgba(89, 134, 218, 0.5);
        }

        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); opacity: 0.6; }
            50% { transform: translateY(-20px); opacity: 1; }
        }

        @keyframes scaleIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes fadeInUp {
            0% { transform: translateY(20px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        .app-wrapper {
            width: 100%;
            min-height: 100vh;
            display: flex;
            animation: fadeIn 0.6s ease-out 2.4s backwards;
        }

        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 100px;
            height: 100vh;
            background: rgba(20, 20, 40, 0.7);
            backdrop-filter: blur(20px);
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border-right: 1px solid var(--border-color);
            z-index: 1000;
            animation: slideInLeft 0.5s ease-out 2.4s backwards;
        }

        @keyframes slideInLeft {
            0% { transform: translateX(-100%); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }

        .sidebar-btn {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
            border: 1px solid rgba(89, 134, 218, 0.3);
            padding: 14px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            color: white;
            text-align: center;
            min-height: 50px;
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-md);
        }

        .sidebar-btn.active {
            background: linear-gradient(135deg, var(--primary-light) 0%, var(--accent-color) 100%);
            box-shadow: 0 0 20px var(--primary-color), 0 8px 25px rgba(89, 134, 218, 0.5);
            transform: scale(1.1);
            animation: pulse-glow 2s ease-in-out infinite;
        }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 20px var(--primary-color), 0 8px 25px rgba(89, 134, 218, 0.5); }
            50% { box-shadow: 0 0 30px var(--primary-color), 0 8px 35px rgba(89, 134, 218, 0.7); }
        }

        .main-content {
            margin-left: 100px;
            flex: 1;
            padding: 40px 20px;
            position: relative;
            animation: slideInUp 0.6s ease-out 2.4s backwards;
        }

        @keyframes slideInUp {
            0% { transform: translateY(30px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        .header {
            position: sticky;
            top: 0;
            background: rgba(20, 20, 40, 0.6);
            backdrop-filter: blur(20px);
            padding: 20px 0;
            margin-bottom: 40px;
            border-bottom: 1px solid var(--border-color);
            z-index: 100;
            animation: slideInDown 0.6s ease-out 2.5s backwards;
        }

        @keyframes slideInDown {
            0% { transform: translateY(-30px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        h1 {
            color: var(--text-primary);
            text-align: center;
            margin-bottom: 10px;
            font-size: 48px;
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary-color) 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-family: 'Pixelify Sans', sans-serif;
        }

        .header-subtitle {
            text-align: center;
            color: var(--text-tertiary);
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .header-links {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
        }

        .header-link-item {
            color: var(--text-primary);
            text-align: center;
            font-size: 15px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            font-weight: 500;
        }

        .header-link-item a {
            color: var(--primary-light);
            text-decoration: none;
            font-weight: 700;
            transition: all 0.3s ease;
            position: relative;
            display: inline-block;
        }

        .header-link-item a::after {
            content: '';
            position: absolute;
            bottom: -3px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--primary-color), var(--primary-light));
            transition: width 0.3s ease;
        }

        .header-link-item a:hover::after {
            width: 100%;
        }

        .header-controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
        }

        .theme-toggle {
            position: relative;
            width: 70px;
            height: 38px;
            background: rgba(89, 134, 218, 0.2);
            border: 2px solid var(--primary-color);
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.4s ease;
            display: flex;
            align-items: center;
            padding: 4px;
            box-shadow: var(--shadow-md);
        }

        .theme-toggle.light {
            background: rgba(255, 217, 61, 0.15);
            border-color: var(--accent-color);
        }

        .toggle-circle {
            width: 30px;
            height: 30px;
            background: var(--primary-light);
            border-radius: 50%;
            transition: all 0.4s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .theme-toggle.light .toggle-circle {
            background: var(--accent-color);
            transform: translateX(32px);
        }

        .search-container {
            display: flex;
            justify-content: center;
            margin-bottom: 40px;
            gap: 15px;
            flex-wrap: wrap;
        }

        #searchInput {
            padding: 16px 24px;
            width: 100%;
            max-width: 500px;
            border-radius: 16px;
            border: 2px solid var(--border-color);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: var(--shadow-lg);
            color: var(--text-primary);
            font-size: 16px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        #searchInput::placeholder {
            color: var(--text-tertiary);
        }

        #lolbutton {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
            border: 1px solid rgba(89, 134, 218, 0.3);
            padding: 14px 28px;
            border-radius: 12px;
            color: white;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: var(--shadow-md);
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .letter-section {
            margin-bottom: 50px;
            padding: 35px;
            max-width: 1100px;
            margin-left: auto;
            margin-right: auto;
            min-height: 100px;
            background: rgba(15, 15, 30, 0.15);
            border-radius: 20px;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(8px);
            box-shadow: var(--shadow-lg);
            position: relative;
            overflow: hidden;
        }

        .letter-header {
            color: var(--primary-light);
            font-size: 34px;
            font-weight: 800;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border-color);
            text-shadow: 0 4px 15px rgba(89, 134, 218, 0.2);
            letter-spacing: -0.5px;
            font-family: 'Pixelify Sans', sans-serif;
        }

        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        input[type="button"] {
            background: linear-gradient(135deg, rgba(89, 134, 218, 0.8) 0%, rgba(74, 123, 199, 0.8) 100%);
            border: 1px solid var(--border-color);
            padding: 18px 28px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: var(--shadow-md);
            transition: all 0.3s ease;
            width: 100%;
            max-width: 650px;
            color: white;
            text-align: left;
            position: relative;
            overflow: hidden;
            text-transform: capitalize;
            letter-spacing: 0.5px;
            font-family: 'Pixelify Sans', sans-serif;
        }

        .back-to-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--primary-color), var(--primary-light));
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 500;
            box-shadow: var(--shadow-lg);
            transition: all 0.3s ease;
            color: white;
            font-size: 24px;
        }

        .tooltip .tooltiptext,
        .toast-notification,
        .modal-btn,
        .modal-header {
            font-family: 'Pixelify Sans', sans-serif;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
        }

        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: var(--bg-card);
            padding: 40px;
            border-radius: 20px;
            max-width: 500px;
            width: 90%;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-lg);
        }

        .modal-header {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 20px;
            color: var(--primary-light);
        }

        .modal-body {
            color: var(--text-secondary);
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .modal-footer {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .modal-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
        }

        .modal-btn.primary {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            color: white;
        }
    </style>
</head>
<body>
    <div class="aurora-bg">
        <div class="aurora-layer"></div>
        <div class="aurora-layer"></div>
        <div class="aurora-layer"></div>
        <div class="aurora-layer"></div>
        <div class="floating-orb"></div>
        <div class="floating-orb"></div>
        <div class="floating-orb"></div>
        <div class="floating-orb"></div>
    </div>

    <div class="animated-gradient"></div>

    <div class="splash-screen">
        <div class="splash-content">
            <div class="splash-logo">UGS</div>
            <div class="splash-subtitle">Ultimate Game Stash</div>
            <div class="loading-dots">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        </div>
    </div>

    <div class="app-wrapper">
        <aside class="sidebar">
            <button class="sidebar-btn active">A</button>
            <button class="sidebar-btn">B</button>
            <button class="sidebar-btn">C</button>
            <button class="sidebar-btn">D</button>
            <button class="sidebar-btn">E</button>
            <button class="sidebar-btn">F</button>
            <button class="sidebar-btn">G</button>
            <button class="sidebar-btn">H</button>
        </aside>

        <main class="main-content">
            <header class="header">
                <h1>UGS Files</h1>
                <div class="header-subtitle">Ultimate Game Stash</div>
                <div class="header-links">
                    <div class="header-link-item"><a href="#">Browse Collection</a></div>
                    <div class="header-link-item"><a href="#">Latest Additions</a></div>
                </div>
                <div class="header-controls">
                    <button class="theme-toggle" aria-label="Toggle theme">
                        <span class="toggle-circle"></span>
                    </button>
                </div>
            </header>

            <div class="search-container">
                <input id="searchInput" type="text" placeholder="Search games, titles, or tags..." aria-label="search" />
                <button id="lolbutton">Search</button>
            </div>

            <section class="letter-section">
                <h2 class="letter-header">A</h2>
                <div class="buttons-container">
                    <input type="button" value="Apex Legends" />
                    <input type="button" value="A Plague Tale" />
                    <input type="button" value="Amnesia" />
                </div>
            </section>

            <section class="letter-section">
                <h2 class="letter-header">B</h2>
                <div class="buttons-container">
                    <input type="button" value="Borderlands 3" />
                    <input type="button" value="Baldur's Gate 3" />
                    <input type="button" value="Bioshock" />
                </div>
            </section>

            <section class="letter-section">
                <h2 class="letter-header">C</h2>
                <div class="buttons-container">
                    <input type="button" value="Cyberpunk 2077" />
                    <input type="button" value="Control" />
                    <input type="button" value="Celeste" />
                </div>
            </section>
        </main>
    </div>

    <button class="back-to-top" aria-label="Back to top">↑</button>

    <script>
        const themeToggle = document.querySelector('.theme-toggle');
        const body = document.body;

        themeToggle.addEventListener('click', () => {
            const isLight = body.dataset.theme === 'light';
            body.dataset.theme = isLight ? 'dark' : 'light';
            themeToggle.classList.toggle('light', !isLight);
        });

        const searchInput = document.getElementById('searchInput');
        const letterSections = document.querySelectorAll('.letter-section');

        searchInput.addEventListener('input', (event) => {
            const term = event.target.value.trim().toLowerCase();
            letterSections.forEach(section => {
                const cards = [...section.querySelectorAll('input[type="button"]')];
                const visibleCards = cards.filter(card => card.value.toLowerCase().includes(term));
                cards.forEach(card => {
                    card.style.display = term && !card.value.toLowerCase().includes(term) ? 'none' : '';
                });
                if (!term) {
                    section.style.display = '';
                } else {
                    const hasVisible = visibleCards.length > 0;
                    section.style.display = hasVisible ? '' : 'none';
                }
            });
        });
    </script>
</body>
</html>
